<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in &mdash; SarkitCloud</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css?v=4">
<link rel="stylesheet" href="/css/auth.css?v=1">
<script src="/js/theme.js?v=3"></script>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-brand">
    <svg class="nav-logo" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="9" y="9" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="14" cy="14" r="2" fill="currentColor"/>
      <path d="M14 2V9M14 19V26M2 14H9M19 14H26" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <span>SarkitCloud</span>
  </a>
  <div class="nav-actions">
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to dark theme" aria-pressed="false" title="Switch to dark theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
    </button>
  </div>
</nav>

<main class="auth-wrap">
  <section class="card" id="authCard">
    <h2>Sign in</h2>
    <p class="auth-note">Continue with your Google account. No separate password is needed.</p>
    <button type="button" class="btn btn-accent btn-full" id="googleBtn">Continue with Google</button>
    <p class="form-msg" id="msg" role="status"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/config.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
